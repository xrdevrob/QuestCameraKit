name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  clone-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - run: python3 scripts/check_repo.py
      - run: git diff --check
